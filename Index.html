<style>
:root{--bg:#eef8ea;--card:#fff;--ink:#1d3326;--mut:#5d7565;--g:#2f9e5a;--gd:#1d6e3d;--soft:#dcf1dc;--line:#d3e5d3;--y:#fff0bd;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#182a1f;--ink:#e6f2e9;--mut:#9bb5a3;--g:#4cc47c;--gd:#14472a;--soft:#1f3a29;--line:#2b4636;--y:#3b3414;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#182a1f;--ink:#e6f2e9;--mut:#9bb5a3;--g:#4cc47c;--gd:#14472a;--soft:#1f3a29;--line:#2b4636;--y:#3b3414;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--gd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--gd);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:560px;margin:0 auto}
header b{flex:1;font-size:1.05rem}
header button{background:none;border:0;color:#fff;font-size:1.6rem;line-height:1;padding:0 6px;min-width:36px;min-height:36px}
#app{max-width:560px;margin:0 auto;padding:14px 14px 110px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 7px;font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px}
nav button i{font-style:normal;font-size:1.35rem}
nav button.on{color:var(--g);font-weight:700}
h2{font-size:1.25rem;margin:4px 0 6px}h3{font-size:1.05rem;margin:0 0 4px}
p{margin:0 0 8px}.mut{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(160deg,var(--g),var(--gd));color:#fff;border:0}
.hero .mut{color:#e3f6e8}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:700;padding:14px;min-height:50px;margin-top:8px;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.w{background:#fff;color:var(--gd)}.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;min-height:96px}
.tile i{display:block;font-style:normal;font-size:2rem}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;font:inherit;color:var(--ink);min-height:56px;cursor:pointer}
.item i{font-style:normal;font-size:1.6rem}.item div{flex:1}.item small{display:block;color:var(--mut)}
.chk{display:flex;align-items:center;gap:12px;padding:13px;border:2px solid var(--line);border-radius:14px;margin-bottom:9px;background:var(--card);width:100%;font:inherit;color:var(--ink);text-align:left;min-height:54px;cursor:pointer}
.chk.on{border-color:var(--g);background:var(--soft)}.chk b{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}.chk.on b{background:var(--g);border-color:var(--g)}
.bar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--g);border-radius:8px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px;min-height:46px}
label{font-size:.9rem;font-weight:700}label.c{display:flex;gap:8px;align-items:flex-start;font-weight:400}label.c input{width:22px;min-height:22px;margin:2px 0}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:9px 4px;font:inherit;font-size:.86rem;min-height:42px}.tabs .on{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.sm{border:0;background:none;color:var(--mut);font:inherit;font-size:.9rem;padding:8px 10px;min-height:40px;cursor:pointer}.sm.on{color:#e2483d;font-weight:700}
.badge{display:inline-block;background:var(--y);border-radius:20px;padding:6px 12px;margin:0 6px 6px 0;font-size:.9rem}
.badge.off{opacity:.35;filter:grayscale(1)}
.days{display:flex;justify-content:space-between;text-align:center;font-size:.8rem}.days div{flex:1}.days span{display:grid;place-items:center;width:34px;height:34px;margin:3px auto 0;border-radius:50%;background:var(--soft)}.days .o span{background:var(--g);color:#fff}
.em{font-size:3.4rem;text-align:center;display:block}.cm{background:var(--soft);border-radius:10px;padding:7px 10px;margin:5px 0;font-size:.9rem}
@media(prefers-reduced-motion:no-preference){.bar span{transition:width .4s}}
:root{--b1:#bfe6fb;--b2:#e3f5e1;--b3:#bfe5a9;--navy:#10285c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#10243a;--b2:#12261b;--b3:#0f1a13}}
:root[data-theme="dark"]{--b1:#10243a;--b2:#12261b;--b3:#0f1a13}
body{background:linear-gradient(180deg,var(--b1) 0,var(--b2) 45%,var(--b3) 100%) fixed;min-height:100vh}
body::before{background:#1b7a3e}
header{background:#1b7a3e;border-radius:0 0 18px 18px;box-shadow:0 2px 10px #0003}
header em{font-style:normal;color:#b9f5a6}
header .hb{font-size:1.5rem;width:36px;text-align:center}
header .bell{position:relative;font-size:1.2rem;width:36px;text-align:center}
header .bell::after{content:"";position:absolute;top:-2px;right:4px;width:9px;height:9px;border-radius:50%;background:#ff4d4d}
nav{background:var(--navy);border:0;border-radius:20px 20px 0 0;box-shadow:0 -3px 12px #0003}
nav button{color:#cfdcf5}nav button.on{color:#9cf08f}
nav button.on i{background:#ffffff22;border-radius:12px;padding:0 10px}
.card{border:0;border-radius:20px;box-shadow:0 3px 10px #1d4a2a1f}
.card.yel{background:var(--y);border:2px solid #ffd966}
.ttl{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:2px auto 8px;background:var(--card);border:2px solid #7fd08a;color:var(--ink);font-weight:800;font-size:1.2rem;padding:8px 22px;border-radius:30px}
.sub{text-align:center;font-weight:700;margin:0 0 12px}
.lab{text-align:center;font-weight:800;margin-bottom:8px}
.big{font-size:4.6rem;line-height:1;flex:none}
.btn{background:linear-gradient(#34b35f,#1f8a46);border-radius:26px;box-shadow:0 3px 0 #15673a}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn.w{background:#fff;color:#1d6e3d;box-shadow:0 3px 0 #0003}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:0;border-radius:18px;box-shadow:0 3px 8px #1d4a2a22;color:#1d3326}
.g3 .tile{background:#fff6dc;min-height:104px;font-size:.82rem;font-weight:700;padding:12px 4px}
.tile.t0{background:#fff1b8}.tile.t1{background:#d8edff}.tile.t2{background:#d7f3cf}.tile.t3{background:#ffdcec}
.grid .tile.t0,.grid .tile.t1,.grid .tile.t2,.grid .tile.t3{min-height:132px;font-weight:800;font-size:1.02rem}
.item{border:0;border-radius:16px;box-shadow:0 2px 8px #1d4a2a1a}
.item i.no{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;font-size:1rem;font-weight:800;flex:none}
.tabs{background:var(--card);border-radius:30px;padding:4px;gap:2px}
.tabs button{border:0;background:none;border-radius:26px}
.scene{position:relative;height:130px;margin:16px -14px 0;overflow:hidden;border-radius:24px 24px 0 0;background:linear-gradient(#cfeeff 0,#cfeeff 40%,#8fd16f 40%,#6cbd54 100%);text-align:center;font-size:3rem;padding-top:18px}
.scene::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;border-radius:50%;background:#58ad46}
.scene span{position:relative;z-index:1;margin:0 3px}
.logo{text-align:center;padding:26px 14px 10px}.logo .em{font-size:5rem}
.logo h2{font-size:2.1rem;color:#1f8a46;margin:4px 0;font-weight:900;text-shadow:0 2px 0 #fff}
.hl{background:linear-gradient(transparent 55%,#ffe27a 55%);font-weight:800}
.lg{width:62%;max-width:250px;display:block;margin:0 auto}.kd{width:100%;max-width:340px;display:block;margin:0 auto}
.logo{background:#fff;border-radius:24px;padding:18px 12px 12px;box-shadow:0 3px 10px #1d4a2a1f;color:#1d3326}
.bt{flex:none!important;width:38%;border-radius:14px;display:block}

else if(a==="back"){U.s=U.t==="study"?({area:"",list:"area",intro:"list",do:"intro",rec:"do",fin:"list"})[U.s]:""}
else if(a==="reset"){U.s="";U.t="study"}
else if(a==="g"){U.g=+d.i;U.s="area"}
else if(a==="ar"){U.a=+d.i;U.s="list"}
else if(a==="pick"){U.c=d.id;U.t="study";U.s="intro"}
else if(a==="start"){U.s="do"}
else if(a==="tm"){var p=S.prog[U.c]=S.prog[U.c]||[],i=+d.i,x=p.indexOf(i);x>-1?p.splice(x,1):p.push(i);save()}
else if(a==="rec"){U.pic=false;FILE=null;U.s="rec"}
else if(a==="saverec"){S.done[U.c]={date:today(),note:v("nt"),photo:U.pic};save();sendAct();U.s="fin"}
else if(a==="share"){var c=chOf(U.c);S.mine.unshift({id:"m"+Date.now(),e:"🌿",t:c.t+" 완료!"+(S.done[U.c].note?" "+S.done[U.c].note:""),w:S.user.grade+" "+S.user.name,l:0,c:0});save();ins("posts",{emoji:"🌿",title:S.mine[0].t,author:S.mine[0].w});U.t="think";U.ct="story";U.s=""}
else if(a==="ct"){U.ct=d.v}
else if(a==="cs"){U.cs=d.v}
else if(a==="like"){if(ON){if(S.likes[d.id])return;S.likes[d.id]=1;save();ins("likes",{post_id:d.id,user_key:UK})}else{S.likes[d.id]=!S.likes[d.id];save()}}
else if(a==="cmt"){var t=v("c_"+d.id);if(!t)return;(S.cm[d.id]=S.cm[d.id]||[]).push(t);save();ins("comments",{post_id:d.id,text:t,author:S.user.name})}
else if(a==="issue"){var x1=v("is");if(x1){S.issues.unshift(x1);save();ins("issues",{text:x1,author:S.user.name})}}
else if(a==="idea"){var x2=v("id");if(x2){S.ideas.unshift(x2);save();ins("ideas",{text:x2,author:S.user.name})}}
else if(a==="vote"){if(ON&&S.votes.sel!=null)return;S.votes.sel=+d.i;save();ins("votes",{option_idx:+d.i,user_key:UK})}
else if(a==="as"){U.s=d.v}
else if(a==="savelog"){if(!v("lc"))return;S.logs.unshift({d:today(),w:v("lw"),c:v("lc"),r:v("lr")});save();ins("council_logs",{author:S.user.name,participants:v("lw"),content:v("lc"),roles:v("lr")})}
else if(a==="savechg"){if(!v("b1")&&!v("b3"))return;S.changes.unshift({d:today(),a:v("b1"),b:v("b2"),c:v("b3")});save();ins("changes",{author:S.user.name,before_text:v("b1"),process_text:v("b2"),after_text:v("b3")})}
render()});
document.addEventListener("change",function(e){if(e.target.id==="ph"&&e.target.files[0]){U.pic=true;FILE=e.target.files[0];var u=URL.createObjectURL(e.target.files[0]);$("pv").innerHTML='<img alt="내가 올린 사진" src="'+u+'" style="width:100%;border-radius:12px;margin-bottom:10px">'}});
render();if(S.user){pull();flush()}
</script>
</body>
